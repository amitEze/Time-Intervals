# Publishes the web app (the web/ folder) to GitHub Pages on every push to
# main that changes it. It runs the timer tests first.
# The app is then at https://amiteze.github.io/Time-Intervals/
name: Deploy web app

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Run timer tests
        working-directory: web
        run: node --test test/*.test.js

      - uses: actions/configure-pages@v6
        with:
          enablement: true # turns on GitHub Pages the first time, if allowed

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v5
